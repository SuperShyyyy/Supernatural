<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editor Layout / Zoom Prototype</title>
    <script type="module" crossorigin src="../assets/prototype-DxTub6Y9.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="../assets/prototype-D7juXfwD.css">
  </head>

  <body>
    <!--
      应用外壳：固定视口高度，自身永不滚动，也永不允许页面级横向滚动。
      垂直滚动只发生在 .editor-viewport 一层。
    -->
    <div class="app" id="app">
      <header class="ui-bar">
        <span class="ui-bar__title">Layout / Zoom Prototype</span>

        <div class="ui-group" role="group" aria-label="缩放">
          <button type="button" class="ui-btn" id="zoom-out" title="缩小 (Ctrl/Cmd + -)">−</button>
          <select class="ui-select" id="zoom-select" aria-label="缩放级别"></select>
          <button type="button" class="ui-btn" id="zoom-in" title="放大 (Ctrl/Cmd + +)">+</button>
          <button type="button" class="ui-btn ui-btn--text" id="zoom-reset" title="重置 (Ctrl/Cmd + 0)">
            100%
          </button>
        </div>

        <div class="ui-group" role="group" aria-label="模拟视口宽度">
          <label class="ui-label" for="viewport-range">模拟视口</label>
          <input type="range" id="viewport-range" min="320" max="1920" step="1" value="1920" />
          <output class="ui-output" id="viewport-value">1920px</output>
        </div>

        <div class="ui-group ui-group--end">
          <button type="button" class="ui-btn ui-btn--text" id="theme-toggle">Dark</button>
          <button type="button" class="ui-btn ui-btn--text" id="stress-add">+5000 段落</button>
          <button type="button" class="ui-btn ui-btn--text" id="stress-clear">清空压力内容</button>
        </div>
      </header>

      <!-- 唯一的滚动容器：纵向可滚，横向永远不滚 -->
      <div class="editor-viewport" id="editor-viewport">
        <!-- 内容列：宽度 = min(理想 em 宽度, 容器 100%)，自动居中 -->
        <div class="editor-content" id="editor-content"></div>
      </div>

      <footer class="ui-bar ui-bar--status">
        <span>视口 <b id="stat-viewport">–</b></span>
        <span>内容列 <b id="stat-content">–</b></span>
        <span>列宽上限 <b id="stat-max">–</b></span>
        <span>每行约 <b id="stat-cpl">–</b> 字</span>
        <span>DPR <b id="stat-dpr">–</b></span>
        <span class="ui-bar__hint">Ctrl/Cmd + − / + / 0</span>
      </footer>
    </div>

    <!-- 布局审计 HUD：验证"任何元素都不能把横向滚动抛给上层" -->
    <details class="hud" id="hud" open>
      <summary class="hud__summary">
        布局审计 <span class="hud__badge" id="hud-badge">–</span>
      </summary>
      <div class="hud__body">
        <table class="hud__table">
          <thead>
            <tr>
              <th>层</th>
              <th>client</th>
              <th>scroll</th>
              <th>溢出</th>
              <th>策略</th>
            </tr>
          </thead>
          <tbody id="audit-rows"></tbody>
        </table>
        <div class="hud__violators" id="audit-violators"></div>
      </div>
    </details>

  </body>
</html>
